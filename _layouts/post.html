---
layout: default
---
<article class="post wrap">
  <p class="post__back"><a href="{{ '/news/' | relative_url }}">All news</a></p>
  <time class="post__date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{% if page.date_label %}{{ page.date_label }}{% else %}{{ page.date | date: "%-d %B %Y" }}{% endif %}</time>
  <h1>{{ page.title }}</h1>
  {% if page.image %}<img class="post__image" src="{{ page.image | relative_url }}" alt="">{% endif %}
  <div class="post__body">{{ content }}</div>
</article>
