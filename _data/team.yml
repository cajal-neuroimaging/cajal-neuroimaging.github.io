pi:
  name: Guiomar Niso
  photo: guiomar-niso-2026.jpg
  scholar: https://scholar.google.es/citations?user=xqxSCSkAAAAJ
  orcid: https://orcid.org/0000-0001-5872-8924
  bluesky: https://bsky.app/profile/guiomarniso.bsky.social
  x: https://twitter.com/GuiomarNiso
  role: Principal Investigator, Tenured Scientist (CSIC)
  url: https://guiomar.github.io
  bio:
    - Guiomar Niso is the Head of the Neuroimaging Group at the Cajal Neuroscience Center at the Spanish National Research Council (CNC-CSIC) and Vice President of the Young Academy of Spain.
    - She investigates human neurophysiology to advance the understanding of brain dynamics, aiming to enhance clinical applications and improve people’s lives.

